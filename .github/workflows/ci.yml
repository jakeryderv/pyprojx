name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag to validate against package metadata
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked pre-commit validate-config

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest

  package:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - run: uv sync --locked
      - name: Verify release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$(uv version --short)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: uv build --no-sources
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Smoke-test wheel and source distribution
        run: |
          EXPECTED_VERSION="$(uv version --short)"
          export EXPECTED_VERSION
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$artifact" \
              python -I -c \
              'import os, pyprojx; from importlib.metadata import version; from importlib.resources import files; assert version("pyprojx") == os.environ["EXPECTED_VERSION"]; assert files(pyprojx).joinpath("py.typed").is_file(); print(pyprojx.__file__)'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  ci:
    name: CI
    if: always()
    needs: [quality, tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
