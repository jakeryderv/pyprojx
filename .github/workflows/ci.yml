name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag to validate against package metadata
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check this project's pyproject.toml with pyprojx
        run: cargo run --locked --quiet -- check --output-format github
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - run: uv lock --check
      - run: uv run --locked pre-commit validate-config
      - name: Check embedded trove classifiers match uv.lock
        run: uv run --locked python scripts/update_classifiers.py --check

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo test --workspace --locked

  package:
    name: Packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - run: uvx --from twine==7.0.0 twine check --strict dist/*.whl
        shell: bash
      - name: Smoke-test wheel
        shell: bash
        run: |
          expected="pyprojx $(uv run --isolated --no-project python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          wheel="$(ls dist/*.whl)"
          actual="$(uv tool run --isolated --no-cache --from "./$wheel" pyprojx --version)"
          echo "$wheel: $actual"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Read package version
        run: >-
          echo "VERSION=$(uv run --isolated --no-project python -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          >> "$GITHUB_ENV"
      - name: Verify release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$VERSION" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          command: sdist
          args: --out dist
      - run: uvx --from twine==7.0.0 twine check --strict dist/*.tar.gz
      # The sdist omits rust-toolchain.toml; build it with the pinned toolchain explicitly.
      - run: rustup toolchain install --no-self-update
      - name: Smoke-test source distribution
        run: |
          RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | cut -d' ' -f1)"
          export RUSTUP_TOOLCHAIN
          sdist="$(ls dist/*.tar.gz)"
          actual="$(uv tool run --isolated --no-cache --from "./$sdist" pyprojx --version)"
          echo "$sdist: $actual"
          test "$actual" = "pyprojx $VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  ci:
    name: CI
    if: always()
    needs: [quality, tests, package, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
          SDIST: ${{ needs.sdist.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
          test "$SDIST" = success
