name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jakeryderv/pyprojx' && github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pyprojx
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  setup-required:
    if: github.repository == 'jakeryderv/pyprojx' && github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_APP_CLIENT_ID == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Release Please is inactive. Configure the GitHub App as described in docs/publishing.md.' >> "$GITHUB_STEP_SUMMARY"
