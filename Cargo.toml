[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jake Van Slyke <jakervanslyke@gmail.com>"]
license = "MIT"
repository = "https://github.com/jakeryderv/pyprojx"

[workspace.dependencies]
pyprojx_core = { path = "crates/pyprojx_core" }
pyprojx_server = { path = "crates/pyprojx_server" }

annotate-snippets = "0.12.16"
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
insta = { version = "1.48.0", features = ["filters"] }
insta-cmd = "0.7.0"
lsp-server = { version = "0.10.0", default-features = false }
# The protocol's types, generated from its metamodel; Ruff and ty use them too.
lsp-types = { package = "gen-lsp-types", version = "0.11.0", default-features = false, features = ["url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7.0", default-features = false, features = ["text"] }
spdx = { version = "0.13.5", default-features = false }
strsim = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "preserve_order"] }
toml-test-data = "2.14.1"
toml_parser = { version = "1.1.3", default-features = false, features = ["std"] }
# uv's internal crates have unstable APIs; pin exactly and update them together
# (each version is a component of one uv release). Only `standards.rs` uses them.
uv-normalize = "=0.0.85"
uv-pep440 = { version = "=0.0.85", features = ["version-ranges"] }
uv-pep508 = "=0.0.85"
# The version range type used by uv-pep440, under uv's fork's package name.
version-ranges = { package = "astral-version-ranges", version = "0.2.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
