[project]
name = "pyprojx"
dynamic = ["version"]
description = "Version-aware intelligence for pyproject.toml (early development)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/jakeryderv/pyprojx"
Repository = "https://github.com/jakeryderv/pyprojx"
Issues = "https://github.com/jakeryderv/pyprojx/issues"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/pyprojx/Cargo.toml"

[dependency-groups]
dev = ["pre-commit>=4.6.2"]

[tool.uv]
# The project is a Rust binary; `uv sync` only installs development tools.
package = false
# The wheels support Python >=3.8, but development tools need a newer Python.
environments = ["python_version >= '3.11'"]
